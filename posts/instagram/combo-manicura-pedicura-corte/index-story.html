<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nordic Barber Shop — Combo Manicura + Pedicura + Corte (Story)</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("../../../fonts/lost_in_south/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:400;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Regular.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Bold.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-ExtraBold.ttf") format("truetype");
  }

  :root{
    --ink:#101010;
    --charcoal:#1A1A1A;
    --gold:#FFD200;
    --gold-deep:#C9A400;
    --bone:#F7F4EC;
    --steel:rgba(247,244,236,.62);
    --steel-dim:rgba(247,244,236,.28);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);}

  .canvas{
    position:relative;
    width:1080px;
    height:1920px;
  }

  .bg{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 12%;
  }

  /* Scrim sutil arriba, fuerte abajo — igual que el post de feed */
  .scrim-top{
    position:absolute;
    left:0;right:0;top:0;height:22%;
    background:linear-gradient(to bottom,rgba(16,16,16,.62) 0%,rgba(16,16,16,0) 100%);
  }
  .scrim-bottom{
    position:absolute;
    left:0;right:0;bottom:0;height:72%;
    background:linear-gradient(to top,
      var(--ink) 0%,
      var(--ink) 46%,
      rgba(16,16,16,.97) 58%,
      rgba(16,16,16,.72) 76%,
      rgba(16,16,16,0) 100%);
  }

  /* Logo top-right — bajado a la zona segura de story (libre del perfil/UI superior) */
  .logo{
    position:absolute;
    top:260px;right:56px;
    height:80px;
  }

  /* Pill top-left — misma zona segura */
  .pill{
    position:absolute;
    top:274px;left:64px;
    background:var(--gold);
    color:var(--ink);
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:24px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:12px 28px;
    border-radius:40px;
  }

  /* Todo el copy anclado al fondo, con espacio reservado para la barra de respuesta de story */
  .content{
    position:absolute;
    left:64px;right:64px;bottom:296px;
  }

  /* Titular — mismo tamaño y alineación izquierda que el post de feed */
  .headline{
    font-family:"Lost in South";
    font-size:68px;
    line-height:.92;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--bone);
    margin-bottom:30px;
  }
  .headline .hl{color:var(--gold);}

  /* Servicios — el ancla visual del layout, igual que en el feed */
  .services{
    border-top:1px solid rgba(247,244,236,.15);
    margin-bottom:30px;
  }
  .svc{
    display:flex;
    align-items:center;
    padding:22px 0;
    border-bottom:1px solid rgba(247,244,236,.15);
  }
  .svc-name{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    font-size:42px;
    letter-spacing:.01em;
    color:var(--bone);
    flex:1;
  }
  .svc-dots{
    border-bottom:2px dotted rgba(247,244,236,.22);
    flex:1;
    margin:0 18px;
    max-width:150px;
  }
  .svc-tag{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:19px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--steel);
  }

  /* Precio — chip compacto alineado a la izquierda, igual que en el feed */
  .price-chip{
    display:inline-flex;
    flex-direction:column;
    gap:4px;
    background:var(--gold);
    border-radius:18px;
    padding:16px 30px;
  }
  .price-chip-label{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    font-size:15px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(16,16,16,.65);
  }
  .price-chip-value{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:58px;
    line-height:1;
    color:var(--ink);
    letter-spacing:-.01em;
    font-feature-settings:"tnum" 1;
  }

  .footer{
    position:absolute;
    left:0;right:0;bottom:200px;
    display:flex;
    justify-content:center;
  }
  .handle{
    font-family:"Fira Sans Condensed";
    font-weight:600;
    font-size:21px;
    color:var(--steel);
    letter-spacing:.03em;
  }
</style>
</head>
<body>
<div class="canvas">

  <img class="bg" src="assets/bg-story.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <img class="logo" src="../../../logo-variations/Nordic-BarberShop-logo-white.svg" alt="Nordic Barber Shop">
  <div class="pill">Combo especial</div>

  <div class="content">

    <div class="headline">MANICURA + PEDICURA<br>+ <span class="hl">CORTE</span></div>

    <div class="services">
      <div class="svc">
        <div class="svc-name">Manicura Spa</div>
        <div class="svc-dots"></div>
        <div class="svc-tag">Incluido</div>
      </div>
      <div class="svc">
        <div class="svc-name">Pedicura Spa</div>
        <div class="svc-dots"></div>
        <div class="svc-tag">Incluido</div>
      </div>
      <div class="svc">
        <div class="svc-name">Corte de cabello</div>
        <div class="svc-dots"></div>
        <div class="svc-tag">Incluido</div>
      </div>
    </div>

    <div class="price-chip">
      <div class="price-chip-label">Los tres por</div>
      <div class="price-chip-value">Q350</div>
    </div>

  </div>

  <div class="footer">
    <div class="handle">@nordicbarbershopgt</div>
  </div>

</div>
</body>
</html>
