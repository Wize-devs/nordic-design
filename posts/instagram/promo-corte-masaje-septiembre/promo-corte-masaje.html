<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nordic Barber Shop — Promoción Corte + Masaje</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("../../../fonts/lost_in_south/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:400;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Regular.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:600;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-SemiBold.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Bold.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-ExtraBold.ttf") format("truetype");
  }

  :root{
    --ink:#101010;
    --charcoal:#1A1A1A;
    --gold:#FFD200;
    --gold-deep:#C9A400;
    --bone:#F7F4EC;
    --steel:rgba(247,244,236,0.62);
    --steel-dim:rgba(247,244,236,0.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;background:var(--ink);overflow:hidden;}
  body{
    position:relative;
    font-family:"Fira Sans Condensed";
    color:var(--bone);
  }

  .bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 26%;
  }
  .scrim-top{
    position:absolute;
    left:0; right:0; top:0;
    height:260px;
    background:linear-gradient(to bottom, rgba(16,16,16,.72) 0%, rgba(16,16,16,0) 100%);
  }
  .scrim{
    position:absolute;
    left:0; right:0; bottom:0;
    height:66%;
    background:linear-gradient(to bottom, rgba(16,16,16,0) 0%, rgba(16,16,16,.5) 26%, rgba(16,16,16,.95) 58%, rgba(16,16,16,1) 100%);
  }

  .topbar{
    position:absolute;
    top:56px; left:56px; right:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .pill{
    display:inline-block;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    font-size:16px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:9px 22px;
    border-radius:999px;
  }
  .logo{height:60px;}

  .content{
    position:absolute;
    left:64px; right:64px; bottom:150px;
    display:flex;
    flex-direction:column;
    gap:30px;
  }

  .headline{
    font-family:"Lost in South";
    text-transform:uppercase;
    font-size:84px;
    line-height:0.95;
    letter-spacing:.06em;
    text-align:center;
  }
  .headline .hl{color:var(--gold);}

  .services{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .service-row{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .service-icon{width:26px;height:26px;color:var(--gold);flex-shrink:0;}
  .service-name{
    font-weight:600;
    font-size:29px;
    color:var(--bone);
    white-space:nowrap;
  }
  .service-leader{
    flex:1;
    border-bottom:1px dashed var(--steel-dim);
    margin:0 14px;
    transform:translateY(-6px);
  }
  .service-tag{
    font-weight:700;
    font-size:20px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--steel);
    white-space:nowrap;
  }

  .chips{
    display:flex;
    gap:20px;
    justify-content:center;
    align-items:stretch;
    margin-top:6px;
  }
  .chip{
    border-radius:20px;
    padding:18px 30px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .chip-price{
    background:var(--gold);
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
  }
  .chip-price-label{
    font-weight:700;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(16,16,16,.65);
  }
  .chip-price-value{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:64px;
    line-height:1;
    color:var(--ink);
    font-feature-settings:"tnum" 1;
  }

  .chip-date{
    background:var(--charcoal);
    border:1px solid var(--gold-deep);
  }
  .mini-cal{
    width:60px; height:54px;
    position:relative;
    background:var(--ink);
    border-radius:6px;
    border:1px solid var(--gold-deep);
    flex-shrink:0;
    overflow:hidden;
  }
  .mini-cal::before,.mini-cal::after{
    content:"";
    position:absolute;
    top:-5px;
    width:4px; height:9px;
    background:var(--gold-deep);
    border-radius:2px;
  }
  .mini-cal::before{left:11px;}
  .mini-cal::after{right:11px;}
  .mini-cal-head{height:12px;background:var(--gold);}
  .mini-cal-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:2px;
    padding:5px 6px;
  }
  .mini-cal-grid span{
    width:5px; height:5px;
    border-radius:1px;
    background:var(--gold);
    display:block;
  }
  .chip-date-text{display:flex;flex-direction:column;gap:2px;}
  .chip-date-month{
    font-weight:700;
    font-size:22px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .chip-date-range{
    font-weight:600;
    font-size:18px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--steel);
  }

  .footer{
    position:absolute;
    left:0; right:0; bottom:52px;
    display:flex;
    justify-content:center;
  }
  .handle{
    font-weight:600;
    font-size:22px;
    color:var(--steel);
    letter-spacing:.02em;
  }
</style>
</head>
<body>

  <img class="bg" src="assets/bg.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim"></div>

  <div class="topbar">
    <div class="pill">Promoción de septiembre</div>
    <img class="logo" src="../../../logo-variations/Nordic-BarberShop-logo-white.svg" alt="Nordic Barber Shop">
  </div>

  <div class="content">
    <div class="headline">CORTE + <span class="hl">MASAJE</span></div>

    <div class="services">
      <div class="service-row">
        <svg class="service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
        <div class="service-name">Corte de cabello</div>
        <div class="service-leader"></div>
        <div class="service-tag">Incluido</div>
      </div>
      <div class="service-row">
        <svg class="service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18v-6a2 2 0 0 1 2-2h2"/><path d="M4 18h16"/><path d="M6 10V6a2 2 0 0 1 2-2h3l7 4"/><path d="M18 8v10"/><path d="M4 21v-3"/><path d="M20 21v-3"/></svg>
        <div class="service-name">15 min. de masaje</div>
        <div class="service-leader"></div>
        <div class="service-tag">Incluido</div>
      </div>
    </div>

    <div class="chips">
      <div class="chip chip-price">
        <div class="chip-price-label">Los dos por</div>
        <div class="chip-price-value">Q100</div>
      </div>
      <div class="chip chip-date">
        <div class="mini-cal">
          <div class="mini-cal-head"></div>
          <div class="mini-cal-grid">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="chip-date-text">
          <div class="chip-date-month">Septiembre</div>
          <div class="chip-date-range">Del 1 al 30</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="handle">@nordicbarbershopgt</div>
  </div>

</body>
</html>
