<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>productos-cabello-redone (Story)</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("assets/fonts/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-Regular.ttf") format("truetype");
    font-weight:400;
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-Bold.ttf") format("truetype");
    font-weight:700;
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-ExtraBold.ttf") format("truetype");
    font-weight:800;
  }
  :root{
    --ink:#101010;
    --charcoal:#1A1A1A;
    --gold:#FFD200;
    --gold-deep:#C9A400;
    --bone:#F7F4EC;
    --steel:rgba(247,244,236,0.62);
    --steel-dim:rgba(247,244,236,0.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;background:var(--ink);overflow:hidden;}

  .canvas{
    position:relative;
    width:1080px;
    height:1920px;
    background:var(--ink);
    overflow:hidden;
    font-family:"Fira Sans Condensed";
    color:var(--bone);
  }

  .glow{
    position:absolute;
    left:50%; top:760px;
    width:1000px; height:1000px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,210,0,.10) 0%, rgba(255,210,0,0) 62%);
    z-index:0;
  }

  /* ---- interrupted gold hairline frame, gap at top for the logo ---- */
  /* Story safe zones: clear of top profile/close UI (~250px) and bottom reply bar (~220px) */
  .frame-top-l{ position:absolute; top:260px; left:44px; width:369px; height:1px; background:var(--gold-deep); }
  .frame-top-r{ position:absolute; top:260px; right:44px; width:369px; height:1px; background:var(--gold-deep); }
  .frame-left{ position:absolute; top:260px; bottom:230px; left:44px; width:1px; background:var(--gold-deep); }
  .frame-right{ position:absolute; top:260px; bottom:230px; right:44px; width:1px; background:var(--gold-deep); }
  .frame-bottom{ position:absolute; bottom:230px; left:44px; right:44px; height:1px; background:var(--gold-deep); }

  .logo{
    position:absolute;
    top:276px; left:50%;
    transform:translateX(-50%);
    height:64px;
    z-index:6;
  }
  .pill{
    position:absolute;
    top:368px; left:50%;
    transform:translateX(-50%);
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    font-size:16px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:10px 24px;
    border-radius:999px;
    z-index:6;
    white-space:nowrap;
  }

  .product{
    position:absolute;
    top:490px;
    left:50%;
    transform:translateX(-50%);
    width:760px;
    z-index:3;
    -webkit-mask-image: radial-gradient(ellipse 58% 56% at 50% 54%, #000 55%, transparent 88%);
            mask-image: radial-gradient(ellipse 58% 56% at 50% 54%, #000 55%, transparent 88%);
  }

  .seal{
    position:absolute;
    top:920px; left:130px;
    width:290px; height:290px;
    transform:rotate(-12deg);
    border-radius:50%;
    border:2px solid var(--gold);
    background:rgba(16,16,16,.82);
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .seal::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:1px solid var(--gold-deep);
  }
  .seal-pct{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:92px;
    line-height:1;
    color:var(--gold);
    font-feature-settings:"tnum" 1;
  }
  .seal-label{
    font-weight:700;
    font-size:18px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--bone);
    margin-top:8px;
  }

  .content{
    position:absolute;
    left:86px; right:86px;
    bottom:330px;
    z-index:6;
  }
  .kicker{
    font-weight:700;
    font-size:24px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:16px;
  }
  .headline{
    font-family:"Lost in South";
    text-transform:uppercase;
    font-size:86px;
    line-height:.95;
    letter-spacing:.07em;
  }
  .headline .hl{color:var(--gold);}
  .subline{
    font-weight:600;
    font-size:26px;
    color:var(--steel);
    margin-top:26px;
  }

  .footer{
    position:absolute;
    left:0; right:0; bottom:250px;
    display:flex;
    justify-content:center;
    z-index:6;
  }
  .handle{
    font-weight:600;
    font-size:24px;
    color:var(--steel);
    letter-spacing:.02em;
  }
</style>
</head>
<body>
  <div class="canvas">

    <div class="glow"></div>

    <div class="frame-top-l"></div>
    <div class="frame-top-r"></div>
    <div class="frame-left"></div>
    <div class="frame-right"></div>
    <div class="frame-bottom"></div>

    <img class="logo" src="assets/Nordic-BarberShop-logo-white.svg" alt="Nordic Barber Shop">
    <div class="pill">En tienda</div>

    <img class="product" src="assets/producto.png" alt="Red-One Aqua Hair Wax">

    <div class="seal">
      <div class="seal-pct">10%</div>
      <div class="seal-label">De descuento</div>
    </div>

    <div class="content">
      <div class="kicker">Red-One Aqua Hair Wax</div>
      <div class="headline">Llevá tu <span class="hl">estilo</span></div>
      <div class="subline">Hasta agotar existencias</div>
    </div>

    <div class="footer">
      <div class="handle">@nordicbarbershopgt</div>
    </div>

  </div>
</body>
</html>
