<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nordic Barber Shop — Nuevo sistema de citas (Story 1/2)</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("../../../fonts/lost_in_south/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:400;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Regular.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Bold.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-ExtraBold.ttf") format("truetype");
  }

  :root{
    --ink:#101010;
    --charcoal:#1A1A1A;
    --gold:#FFD200;
    --gold-deep:#C9A400;
    --bone:#F7F4EC;
    --steel:rgba(247,244,236,.62);
    --steel-dim:rgba(247,244,236,.28);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);}

  .canvas{
    position:relative;
    width:1080px;
    height:1920px;
  }

  .bg{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 20%;
    filter:brightness(1.9) contrast(1.08) saturate(1.1);
  }

  .scrim-top{
    position:absolute;
    left:0;right:0;top:0;height:16%;
    background:linear-gradient(to bottom,rgba(16,16,16,.3) 0%,rgba(16,16,16,0) 100%);
  }
  .scrim-bottom{
    position:absolute;
    left:0;right:0;bottom:0;height:80%;
    background:linear-gradient(to top,
      var(--ink) 0%,
      var(--ink) 46%,
      rgba(16,16,16,.97) 54%,
      rgba(16,16,16,.7) 68%,
      rgba(16,16,16,0) 100%);
  }

  /* Logo — bajo la zona segura superior de Instagram */
  .logo{
    position:absolute;
    top:250px;right:56px;
    height:80px;
  }

  /* Franja central: todo el copy centrado verticalmente entre las dos zonas seguras de Instagram */
  .content{
    position:absolute;
    left:64px;right:64px;top:230px;bottom:230px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .headline{
    font-family:"Lost in South";
    font-size:108px;
    line-height:.9;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--bone);
  }
  .headline .hl{color:var(--gold);}

  .rule{
    width:130px;height:3px;
    background:var(--gold-deep);
    margin:32px 0 22px;
  }

  .subtitle{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:40px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:80px;
  }

  .screenshot-wrap{
    background:var(--ink);
    border:1px solid var(--gold-deep);
    border-radius:18px;
    padding:12px;
    box-shadow:0 20px 44px rgba(0,0,0,.45);
    margin:0 auto 80px;
    width:92%;
  }
  .screenshot{
    display:block;
    width:100%;
    border-radius:10px;
  }

  .cta{
    border:1px solid var(--gold-deep);
    border-radius:14px;
    padding:22px 24px;
    text-align:center;
  }
  .cta-text{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:28px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
  }

  .footer{
    position:absolute;
    left:0;right:0;bottom:170px;
    display:flex;
    justify-content:center;
  }
  .handle{
    font-family:"Fira Sans Condensed";
    font-weight:600;
    font-size:21px;
    color:var(--steel);
    letter-spacing:.03em;
  }
</style>
</head>
<body>
<div class="canvas">

  <img class="bg" src="assets/bg-story.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <img class="logo" src="../../../logo-variations/Nordic-BarberShop-logo-white.svg" alt="Nordic Barber Shop">

  <div class="content">

    <div class="headline">AGENDAR AHORA<br>ES <span class="hl">MÁS FÁCIL</span></div>
    <div class="rule"></div>
    <div class="subtitle">Nuevo sistema de citas</div>

    <div class="screenshot-wrap">
      <img class="screenshot" src="assets/app-sistema.png" alt="Captura del nuevo sistema de citas de Nordic Barber Shop">
    </div>

    <div class="cta">
      <div class="cta-text">Agendá en el link de la bio</div>
    </div>

  </div>

  <div class="footer">
    <div class="handle">@nordicbarbershopgt</div>
  </div>

</div>
</body>
</html>
