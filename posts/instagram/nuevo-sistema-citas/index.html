<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nordic Barber Shop — Nuevo sistema de citas</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("../../../fonts/lost_in_south/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:400;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Regular.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Bold.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-ExtraBold.ttf") format("truetype");
  }

  :root{
    --ink:#101010;
    --charcoal:#1A1A1A;
    --gold:#FFD200;
    --gold-deep:#C9A400;
    --bone:#F7F4EC;
    --steel:rgba(247,244,236,.62);
    --steel-dim:rgba(247,244,236,.28);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink);}

  .canvas{
    position:relative;
    width:1080px;
    height:1350px;
  }

  .bg{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 22%;
    filter:brightness(1.9) contrast(1.08) saturate(1.1);
  }

  /* Scrim: banda superior con la foto respira, mitad inferior cae a ink plano para el bloque de texto */
  .scrim-top{
    position:absolute;
    left:0;right:0;top:0;height:20%;
    background:linear-gradient(to bottom,rgba(16,16,16,.3) 0%,rgba(16,16,16,0) 100%);
  }
  .scrim-bottom{
    position:absolute;
    left:0;right:0;bottom:0;height:82%;
    background:linear-gradient(to top,
      var(--ink) 0%,
      var(--ink) 58%,
      rgba(16,16,16,.97) 66%,
      rgba(16,16,16,.7) 80%,
      rgba(16,16,16,0) 100%);
  }

  .logo{
    position:absolute;
    top:50px;right:56px;
    height:80px;
  }

  .content{
    position:absolute;
    left:64px;right:64px;top:130px;
  }

  /* Titular — lo primero que se lee, a tamaño display */
  .headline{
    font-family:"Lost in South";
    font-size:84px;
    line-height:.9;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--bone);
  }
  .headline .hl{color:var(--gold);}

  .rule{
    width:120px;height:3px;
    background:var(--gold-deep);
    margin:24px 0 16px;
  }

  /* Subtítulo — texto real, Fira Sans Condensed, ya no compite con el titular */
  .subtitle{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:33px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:28px;
  }

  /* Captura del sistema real */
  .screenshot-wrap{
    background:var(--ink);
    border:1px solid var(--gold-deep);
    border-radius:14px;
    padding:9px;
    box-shadow:0 16px 36px rgba(0,0,0,.45);
    margin:0 auto 30px;
    width:72%;
  }
  .screenshot{
    display:block;
    width:100%;
    border-radius:7px;
  }

  /* Lista de beneficios — solo el label, a tamaño grande */
  .benefits{
    border-top:1px solid rgba(247,244,236,.15);
    margin-bottom:28px;
  }
  .benefit-row{
    display:flex;
    align-items:baseline;
    gap:18px;
    padding:16px 0;
    border-bottom:1px solid rgba(247,244,236,.15);
  }
  .benefit-num{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:25px;
    color:var(--gold);
    font-feature-settings:"tnum" 1;
  }
  .benefit-label{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    font-size:34px;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:var(--bone);
  }

  .cta{
    border:1px solid var(--gold-deep);
    border-radius:12px;
    padding:14px 24px;
    text-align:center;
  }
  .cta-text{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:21px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
  }

  .footer{
    position:absolute;
    left:0;right:0;bottom:44px;
    display:flex;
    justify-content:center;
  }
  .handle{
    font-family:"Fira Sans Condensed";
    font-weight:600;
    font-size:20px;
    color:var(--steel);
    letter-spacing:.03em;
  }
</style>
</head>
<body>
<div class="canvas">

  <img class="bg" src="assets/bg.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <img class="logo" src="../../../logo-variations/Nordic-BarberShop-logo-white.svg" alt="Nordic Barber Shop">

  <div class="content">

    <div class="headline">AGENDAR AHORA<br>ES <span class="hl">MÁS FÁCIL</span></div>
    <div class="rule"></div>
    <div class="subtitle">Nuevo sistema de citas</div>

    <div class="screenshot-wrap">
      <img class="screenshot" src="assets/app-sistema.png" alt="Captura del nuevo sistema de citas de Nordic Barber Shop">
    </div>

    <div class="benefits">
      <div class="benefit-row">
        <div class="benefit-num">01</div>
        <div class="benefit-label">Cambiamos de sistema</div>
      </div>
      <div class="benefit-row">
        <div class="benefit-num">02</div>
        <div class="benefit-label">Nueva versión</div>
      </div>
      <div class="benefit-row">
        <div class="benefit-num">03</div>
        <div class="benefit-label">Seguimos mejorando</div>
      </div>
    </div>

    <div class="cta">
      <div class="cta-text">Agendá en el link de la bio</div>
    </div>

  </div>

  <div class="footer">
    <div class="handle">@nordicbarbershopgt</div>
  </div>

</div>
</body>
</html>
