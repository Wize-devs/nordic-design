<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>se-busca-host-v2</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("assets/fonts/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-Regular.ttf") format("truetype");
    font-weight:400;
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-Bold.ttf") format("truetype");
    font-weight:700;
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-ExtraBold.ttf") format("truetype");
    font-weight:800;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;background:#101010;overflow:hidden;}
  .canvas{
    position:relative;
    width:1080px;
    height:1350px;
    background:#101010;
  }
  .bg-wrap{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .bg{
    position:absolute;
    top:0;
    left:0;
    width:1080px;
    height:auto;
  }
  .scrim-top{
    position:absolute;
    left:0; right:0; top:0;
    height:22%;
    background:linear-gradient(to bottom, rgba(16,16,16,.75) 0%, rgba(16,16,16,.25) 65%, rgba(16,16,16,0) 100%);
  }
  .scrim-bottom{
    position:absolute;
    left:0; right:0; bottom:0;
    height:48%;
    background:linear-gradient(to top, rgba(16,16,16,.97) 0%, rgba(16,16,16,.80) 35%, rgba(16,16,16,.35) 65%, rgba(16,16,16,0) 100%);
  }
  .logo{
    position:absolute;
    top:64px;
    right:64px;
    height:120px;
  }
  .bottom-block{
    position:absolute;
    left:64px; right:64px;
    bottom:68px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .pill{
    align-self:flex-start;
    background:#FFD200;
    color:#101010;
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:24px;
    letter-spacing:.10em;
    text-transform:uppercase;
    padding:12px 30px;
    border-radius:40px;
  }
  .headline{
    font-family:"Lost in South";
    font-size:104px;
    letter-spacing:.07em;
    line-height:0.96;
    text-transform:uppercase;
    color:#F7F4EC;
  }
  .headline .hl{color:#FFD200;}
  .divider{
    width:64px;
    height:3px;
    background:#FFD200;
    opacity:.7;
  }
  .caption{
    font-family:"Fira Sans Condensed";
    font-weight:400;
    font-size:30px;
    line-height:1.45;
    color:#F7F4EC;
    opacity:.88;
    max-width:880px;
  }
  .cta{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:28px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#FFD200;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="bg-wrap"><img class="bg" src="assets/bg.png"></div>
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>
    <img class="logo" src="assets/Nordic-BarberShop-logo-white.svg">
    <div class="bottom-block">
      <div class="pill">Estamos contratando</div>
      <div class="headline">Buscamos <span class="hl">host</span></div>
      <div class="divider"></div>
      <div class="caption">Actitud, presencia y pasión por la experiencia. Eso es lo que buscamos.</div>
      <div class="cta">Enviá tu CV por DM →</div>
    </div>
  </div>
</body>
</html>
