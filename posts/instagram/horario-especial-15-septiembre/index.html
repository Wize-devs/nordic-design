<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nordic Barber Shop — Horario especial 15 de septiembre</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("../../../fonts/lost_in_south/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:400;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Regular.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Bold.ttf") format("truetype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-ExtraBold.ttf") format("truetype");
  }

  :root{
    --ink:#101010;
    --charcoal:#1A1A1A;
    --gold:#FFD200;
    --gold-deep:#C9A400;
    --bone:#F7F4EC;
    --steel:rgba(247,244,236,.62);
    --steel-dim:rgba(247,244,236,.28);
    --celeste:#4997D0; /* azul de la bandera de Guatemala -- excepcion de marca deliberada, ver copy.json build_method */
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink);}

  .canvas{
    position:relative;
    width:1080px;
    height:1350px;
  }

  .bg{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 14%;
  }

  /* Scrim sutil arriba, fuerte abajo */
  .scrim-top{
    position:absolute;
    left:0;right:0;top:0;height:22%;
    background:linear-gradient(to bottom,rgba(16,16,16,.62) 0%,rgba(16,16,16,0) 100%);
  }
  .scrim-bottom{
    position:absolute;
    left:0;right:0;bottom:0;height:72%;
    background:linear-gradient(to top,
      var(--ink) 0%,
      var(--ink) 46%,
      rgba(16,16,16,.97) 58%,
      rgba(16,16,16,.72) 76%,
      rgba(16,16,16,0) 100%);
  }

  /* Logo top-right */
  .logo{
    position:absolute;
    top:50px;right:56px;
    height:80px;
  }

  /* Fila superior: pill + bandera, top-left */
  .eyebrow-row{
    position:absolute;
    top:64px;left:64px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .pill{
    background:var(--celeste);
    color:var(--ink);
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:24px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:12px 28px;
    border-radius:40px;
  }
  .flag-badge{
    height:48px;
    width:auto;
    display:block;
    border-radius:6px;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }

  /* Todo el copy anclado al fondo, con espacio reservado para el footer */
  .content{
    position:absolute;
    left:64px;right:64px;bottom:126px;
  }

  /* Titular */
  .headline{
    font-family:"Lost in South";
    font-size:68px;
    line-height:.92;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--bone);
    margin-bottom:30px;
  }
  .headline .hl{color:var(--celeste);}

  /* Fila de horario — el ancla visual del layout */
  .hours{
    border-top:1px solid rgba(247,244,236,.15);
    margin-bottom:30px;
  }
  .hours-row{
    display:flex;
    align-items:center;
    padding:26px 0;
    border-bottom:1px solid rgba(247,244,236,.15);
  }
  .hours-day{
    font-family:"Fira Sans Condensed";
    font-weight:700;
    font-size:34px;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:var(--bone);
    flex:1;
  }
  .hours-dots{
    border-bottom:2px dotted rgba(247,244,236,.22);
    flex:1;
    margin:0 18px;
    max-width:110px;
  }
  .hours-time{
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:38px;
    letter-spacing:0;
    color:var(--celeste);
    font-feature-settings:"tnum" 1;
  }

  .caption{
    font-family:"Fira Sans Condensed";
    font-weight:400;
    font-size:28px;
    line-height:1.4;
    color:var(--bone);
    opacity:.85;
  }

  .footer{
    position:absolute;
    left:0;right:0;bottom:48px;
    display:flex;
    justify-content:center;
  }
  .handle{
    font-family:"Fira Sans Condensed";
    font-weight:600;
    font-size:21px;
    color:var(--steel);
    letter-spacing:.03em;
  }
</style>
</head>
<body>
<div class="canvas">

  <img class="bg" src="assets/bg.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <img class="logo" src="../../../logo-variations/Nordic-BarberShop-logo-white.svg" alt="Nordic Barber Shop">

  <div class="eyebrow-row">
    <div class="pill">Horario especial</div>
    <svg class="flag-badge" viewBox="0 0 150 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandera de Guatemala">
      <rect x="0" y="0" width="150" height="100" fill="#4997D0"/>
      <rect x="50" y="0" width="50" height="100" fill="#FFFFFF"/>
      <g transform="translate(75,52)">
        <g fill="#3F8F46">
          <ellipse cx="-19" cy="-2" rx="5" ry="10" transform="rotate(-20 -19 -2)"/>
          <ellipse cx="-16" cy="8" rx="5" ry="10" transform="rotate(-5 -16 8)"/>
          <ellipse cx="-11" cy="17" rx="5" ry="10" transform="rotate(15 -11 17)"/>
          <ellipse cx="19" cy="-2" rx="5" ry="10" transform="rotate(20 19 -2)"/>
          <ellipse cx="16" cy="8" rx="5" ry="10" transform="rotate(5 16 8)"/>
          <ellipse cx="11" cy="17" rx="5" ry="10" transform="rotate(-15 11 17)"/>
        </g>
        <g stroke="#6B6B6B" stroke-width="2.4" stroke-linecap="round">
          <line x1="-16" y1="10" x2="16" y2="-8"/>
          <line x1="-16" y1="-8" x2="16" y2="10"/>
        </g>
        <g fill="#6B4A2E">
          <rect x="-19" y="8" width="6" height="3.2" rx="1"/>
          <rect x="13" y="8" width="6" height="3.2" rx="1"/>
        </g>
        <rect x="-13" y="9" width="26" height="10" rx="2" fill="#E8D9A0" stroke="#C9B87A" stroke-width="0.8"/>
        <path d="M -3 8 C -6 -6, -2 -14, 3 -20 C 8 -14, 9 -4, 5 6 Z" fill="#3F8F46"/>
        <ellipse cx="3" cy="-19" rx="4.2" ry="4.6" fill="#3F8F46"/>
        <path d="M 5 -21 C 8 -22, 10 -20, 9 -17 C 7.5 -18.5, 6 -19, 5 -21 Z" fill="#3F8F46"/>
        <ellipse cx="1" cy="-13" rx="2.6" ry="4.6" fill="#B5342D"/>
      </g>
    </svg>
  </div>

  <div class="content">

    <div class="headline">EL 15 DE SEPTIEMBRE<br><span class="hl">SÍ ABRIMOS</span></div>

    <div class="hours">
      <div class="hours-row">
        <div class="hours-day">Martes 15 de sept.</div>
        <div class="hours-dots"></div>
        <div class="hours-time">10 AM&ndash;5 PM</div>
      </div>
    </div>

    <div class="caption">Día de la Independencia &mdash; agenda tu cita con tiempo.</div>

  </div>

  <div class="footer">
    <div class="handle">@nordicbarbershopgt</div>
  </div>

</div>
</body>
</html>
