<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("../../../fonts/lost_in_south/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-Regular.ttf") format("truetype");
    font-weight:400;
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("../../../fonts/Fira Sans Condensed/FiraSansCondensed-ExtraBold.ttf") format("truetype");
    font-weight:800;
  }

  :root{
    --ink:#101010;
    --bone:#f7f4ec;
    --gold:#ffd200;
    --steel: rgba(247,244,236,0.62);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ width:1080px; height:1920px; background:var(--ink); overflow:hidden; }

  .canvas{ position:relative; width:1080px; height:1920px; }

  .bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center top;
  }

  .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(to top, rgba(16,16,16,0.0) 0%, rgba(16,16,16,0.55) 12%, rgba(16,16,16,0.0) 26%),
      linear-gradient(to bottom, rgba(16,16,16,0.0) 58%, rgba(16,16,16,0.88) 74%, var(--ink) 88%);
  }

  .pill{
    position:absolute; top:300px; left:96px;
    background:var(--gold); color:var(--ink);
    font-family:"Fira Sans Condensed"; font-weight:800;
    font-size:26px; letter-spacing:.1em; text-transform:uppercase;
    padding:14px 26px;
  }

  .logo{
    position:absolute; top:296px; right:96px;
    height:60px; width:auto;
  }

  .content{
    position:absolute; left:96px; right:96px; bottom:300px;
  }

  .headline{
    font-family:"Lost in South"; text-transform:uppercase;
    font-size:132px; line-height:0.94; letter-spacing:.07em;
    color:var(--bone);
  }

  .headline .highlight{ color:var(--gold); }

  .caption{
    margin-top:36px;
    font-family:"Fira Sans Condensed"; font-weight:400;
    font-size:36px; line-height:1.4;
    color:var(--steel);
    max-width:880px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="raw/gen-01.png">
    <div class="scrim"></div>
    <div class="pill">Estamos contratando</div>
    <img class="logo" src="../../../logo-variations/Nordic-BarberShop-logo-white.png">
    <div class="content">
      <div class="headline">BUSCAMOS<br><span class="highlight">RECEPCIONISTA</span></div>
      <div class="caption">Encargada de caja y atención al cliente. Envíanos tu CV por DM.</div>
    </div>
  </div>
</body>
</html>
